<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Willow Café</title>
  <link rel="icon" type="svg" href="images/title-logo.svg">
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
  <script src="script2.js" defer></script>
</head>

<body>

  <div class="signup-layout">
    <div class="top-buttons">
      <a href="index.html" class="icon-button" title="Back Home">
        <img src="./images/backbtn2.svg" alt="Back">
      </a>
    </div>
    <div class="signup-form-container">


      <h2>Create Your Account</h2>
<form id="signupForm">
  <label for="username">Username</label>
  <input type="text" id="username" name="username" placeholder="Choose a username" />
  <div id="username-error-box" class="error-message" style="display:none;"></div>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" placeholder="Enter your email" />
  <div id="email-error-box" class="error-message" style="display:none;"></div>

  <label for="password">Password</label>
  <input type="password" id="password" name="password" placeholder="Create a password" />
  <div id="password-error-box" class="error-message" style="display:none;"></div>

  <label for="password2">Confirm Password</label>
<input type="password" id="password2" name="password2" placeholder="Confirm your password" />
<div id="password2-error-box" class="error-message" style="display:none;"></div>

  <button type="submit">Sign Up</button>

        <p class="link">Already have an account? <a href="login.html">Login here</a></p>

        <div id="successMessage" class="success-message" style="display: none;"></div> 
      </form>
    </div>
  </div>

  <div id="loadingSpinner" class="loading-spinner" style="display: none;">
        <img src="./images/loadingspinner.gif" alt="Loading..." />
    </div>
</body>
</html>
